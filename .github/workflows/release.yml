name: Publish Release

# Cara pakai:
#   git tag v1.1.0 && git push origin v1.1.0
# Workflow ini otomatis: install -> audit -> type-check -> unit test -> build
# -> publish GitHub Release (published, latest) + lampirkan catatan rilis.
# Bisa juga dijalankan manual dari tab Actions (workflow_dispatch).

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag rilis (mis. v1.1.0). Wajib diawali "v".'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-and-test:
    name: Build & test sebelum rilis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Dependency security audit
        run: npm audit --audit-level=moderate

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

  publish:
    name: Publish GitHub Release 🚀
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tentukan tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Ambil cuplikan CHANGELOG
        id: changelog
        run: |
          TAG="${{ steps.tag.outputs.value }}"
          VERSION="${TAG#v}"
          # Ambil section ## [VERSION] dari CHANGELOG.md (atau fallback)
          NOTES=$(awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" {flag=1; next}
            flag && /^## \\[/ {flag=0}
            flag {print}
          ' CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            NOTES="Lihat daftar commit di bawah untuk detail perubahan."
          fi
          {
            echo "body<<EOF"
            echo "$NOTES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.value }}
          name: 📰 Washington Post Clone ${{ steps.tag.outputs.value }}
          body: |
            ## ✨ Sorotan Rilis ${{ steps.tag.outputs.value }}

            ${{ steps.changelog.outputs.body }}

            ---

            ### 🚀 Cara menjalankan
            ```bash
            git clone https://github.com/njutawan/Washington-Post.git
            cd Washington-Post
            git checkout ${{ steps.tag.outputs.value }}
            npm install
            npm run dev
            ```
            Buka **http://localhost:3000** 🎉

            📖 Dokumentasi lengkap: [README.md](https://github.com/njutawan/Washington-Post/blob/${{ steps.tag.outputs.value }}/README.md) · 📋 [CHANGELOG](https://github.com/njutawan/Washington-Post/blob/${{ steps.tag.outputs.value }}/CHANGELOG.md)
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: true
