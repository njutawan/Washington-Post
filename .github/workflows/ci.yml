name: CI

on:
  push:
    branches: [main, 'arena/**']
  pull_request:
    branches: [main]

jobs:
  lint-build-test:
    name: Lint, build, unit test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      # Allowlist-based audit gate (see scripts/audit-gate.mjs + SECURITY_AUDIT.md):
      # fails on any NEW moderate+ advisory, while acknowledging the few with
      # no published fix and negligible exposure. Raw `--audit-level=moderate`
      # would be red forever on those (braces, sprintf-js, webpack-dev-middleware).
      - name: Dependency security audit
        run: npm run audit:ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint --if-present
        continue-on-error: true

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: |
            .next
            public
            package.json
            package-lock.json
          retention-days: 7

  e2e:
    name: Playwright smoke tests
    runs-on: ubuntu-latest
    needs: lint-build-test
    timeout-minutes: 15
    # The critical user journeys are a required gate. Broader visual and
    # exhaustive accessibility suites remain available through their scripts,
    # but do not make every push depend on external images or screenshot
    # baselines.
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build app
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

      - name: Run critical Playwright smoke tests
        run: npx playwright test e2e/smoke.spec.ts
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: [lint-build-test, e2e]
    # Keep a visible green result for validated pull requests and feature
    # branches. Production-only deployment steps below still run exclusively
    # from main, so a PR can never deploy to production.
    if: ${{ always() && needs.lint-build-test.result == 'success' && needs.e2e.result == 'success' }}
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: Deployment not required for this ref
        if: github.ref != 'refs/heads/main'
        run: echo "::notice::Validated successfully — production deploys run from main only."

      # The `secrets` context is not allowed in job-level `if`, so the gate
      # lives here: without Vercel secrets the remaining steps skip (green)
      # instead of red-failing. Set VERCEL_TOKEN / VERCEL_ORG_ID /
      # VERCEL_PROJECT_ID in Settings → Secrets and variables → Actions to
      # enable real deploys (see README § Deploy).
      - name: Check Vercel secrets
        if: github.ref == 'refs/heads/main'
        id: gate
        run: |
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ] || [ -z "${{ secrets.VERCEL_ORG_ID }}" ] || [ -z "${{ secrets.VERCEL_PROJECT_ID }}" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Vercel secrets not set — deploy skipped (see README § Deploy)."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: github.ref == 'refs/heads/main' && steps.gate.outputs.ready == 'true'

      - name: Setup Node
        if: github.ref == 'refs/heads/main' && steps.gate.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Vercel CLI
        if: github.ref == 'refs/heads/main' && steps.gate.outputs.ready == 'true'
        run: npm install -g vercel@latest

      - name: Pull Vercel environment
        if: github.ref == 'refs/heads/main' && steps.gate.outputs.ready == 'true'
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build
        if: github.ref == 'refs/heads/main' && steps.gate.outputs.ready == 'true'
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        id: deploy
        if: github.ref == 'refs/heads/main' && steps.gate.outputs.ready == 'true'
        run: |
          URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$URL" >> $GITHUB_OUTPUT
